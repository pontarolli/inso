project:
  type: website
  preview:
    port: 4242
    browser: false
  render:
    - index.qmd
    - aulas/*.qmd
  pre-render: scripts/set_version.py

website:
  title: "Informática e Sociedade"
  page-navigation: false
  repo-url: https://github.com/pontarolli/inso-aulas
  page-footer:
    left: "IFSP Boituva · Técnico em Redes de Computadores"
    right: "Ricardo Pasquati Pontarolli"

lang: pt

format:
  revealjs:
    theme: [default, theme/ifsp.scss]
    slide-number: c/t
    transition: slide
    background-transition: fade
    incremental: false
    center-title-slide: true
    preview-links: auto
    chalkboard: true
    code-line-numbers: true
    highlight-style: github
    footer: "IFSP Boituva · Informática e Sociedade"
    toc: false
    embed-resources: false
